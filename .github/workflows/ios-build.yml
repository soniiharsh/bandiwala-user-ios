name: Build Bandiwala iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (sync Firebase versions)
        run: |
          flutter pub get
          flutter pub upgrade firebase_core firebase_auth firebase_messaging firebase_analytics cloud_firestore firebase_app_check
          flutter pub deps | grep -i firebase

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: bandiwala-ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 7
